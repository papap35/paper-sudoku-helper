<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紙本數獨輔助系統</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sudoku.css') }}">
</head>
<body>
  <main class="page">
    <h1>紙本數獨輔助系統</h1>
    <p class="subtitle">拍照辨識盤面，或手動輸入，再用候選數字、錯誤檢查與提示來幫助思考——但不會直接告訴你答案。</p>

    <section class="upload-box">
      <label class="file-label" for="image-input">
        📷 拍照 / 上傳數獨照片
        <input type="file" id="image-input" accept="image/*" capture="environment">
      </label>
      <button id="scan-btn" type="button" disabled>辨識盤面</button>
      <img id="preview" alt="" hidden>
    </section>

    <section class="board-wrap">
      <div id="board" class="board"></div>
    </section>

    <section class="controls">
      <button id="analyze-btn" type="button">分析盤面（候選數字 / 錯誤檢查）</button>
      <label class="toggle">
        <input type="checkbox" id="show-candidates">
        顯示候選數字
      </label>
      <button id="hint-btn" type="button">給我一個提示</button>
      <button id="clear-btn" type="button" class="secondary">清空盤面</button>
    </section>

    <section class="status">
      <div id="progress-text" class="progress-text"></div>
      <div id="progress-bar" class="progress-bar"><div id="progress-fill"></div></div>
      <div id="hint-text" class="hint-text"></div>
      <div id="message" class="message"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='sudoku.js') }}"></script>
</body>
</html>
